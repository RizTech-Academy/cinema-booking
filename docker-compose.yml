# The two-tier stack: PostgreSQL (source of truth) and Redis (fast, disposable).
# `docker compose up -d` starts both; `scripts/verify.sh` proves the whole
# design against them.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cinema -d cinema']
      interval: 2s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
